name: conformance

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:
    inputs:
      lite_repo:
        description: 'Test a different supabase-lite, e.g. a fork with a fix (owner/repo). Leave empty for the pinned upstream.'
        required: false
        default: ''
      lite_ref:
        description: 'Branch, tag or commit in that repo. Runs with this set do not publish the report.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.119.0

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Use a different Lite (only when lite_ref is given)
        if: inputs.lite_ref != ''
        env:
          LITE_REPO: ${{ inputs.lite_repo || 'olirice/supabase-lite' }}
          LITE_REF: ${{ inputs.lite_ref }}
        run: |
          git -C targets/supabase-lite fetch "https://github.com/$LITE_REPO.git" "$LITE_REF"
          git -C targets/supabase-lite checkout --detach FETCH_HEAD
          echo "LITE_REPO=$LITE_REPO" >> "$GITHUB_ENV"
          git -C targets/supabase-lite log -1 --format='Testing %h %s'

      - name: Install kit and Lite
        run: |
          npm ci --no-audit --no-fund
          npm run setup:lite

      - name: Check generated seed files, unit tests, types
        run: |
          npm run seed -- --check
          npm test
          npm run typecheck

      - name: Start reference (supabase start, only Postgres + PostgREST + GoTrue + Kong)
        timeout-minutes: 10
        run: |
          supabase start -x studio,storage-api,realtime,edge-runtime,logflare,vector,imgproxy,postgres-meta
          npm run env   # writes .env from `supabase status`, same as on a laptop

      - name: Start target (Supabase Lite on :54400)
        run: |
          nohup npm run lite > lite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:54400/health && exit 0; sleep 1; done
          cat lite.log; exit 1

      - name: Run conformance cases
        run: npm run conformance

      - name: Build report
        if: always()
        run: |
          test -f results/results.json || exit 0
          npm run report
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "::group::Per-case outputs (reference vs target)"
          node -e 'for (const c of require("./results/results.json").cases) console.log(c.verdict.padEnd(5), c.id, "\n  REF", JSON.stringify(c.reference), "\n  TGT", JSON.stringify(c.target))'
          echo "::endgroup::"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: |
            results/
            site/
            lite.log
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && inputs.lite_ref == ''
        with:
          path: site

  deploy-pages:
    needs: conformance
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && inputs.lite_ref == ''
    runs-on: ubuntu-latest
    # Requires Settings → Pages → Source: "GitHub Actions". Until that is set, this job
    # fails without failing the workflow.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
