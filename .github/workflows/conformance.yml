name: conformance

on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_CLI_VERSION: 2.119.0

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Install kit and Lite
        run: |
          npm ci --no-audit --no-fund
          npm run setup:lite

      - name: Check generated seed files, unit tests, types
        run: |
          npm run seed -- --check
          npm test
          npm run typecheck

      - name: Start reference (supabase start, only Postgres + PostgREST + GoTrue + Kong)
        run: |
          supabase start -x studio,storage-api,realtime,edge-runtime,logflare,vector,imgproxy,postgres-meta
          eval "$(supabase status -o env)"
          echo "REFERENCE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "REFERENCE_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Start target (Supabase Lite on :54400)
        run: |
          nohup npm run lite > lite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:54400/health && exit 0; sleep 1; done
          cat lite.log; exit 1

      - name: Run conformance cases
        run: npm run conformance

      - name: Build report
        if: always()
        run: |
          test -f results/results.json || exit 0
          npm run report
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-results
          path: |
            results/
            site/
            lite.log
          if-no-files-found: ignore

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        with:
          path: site

  deploy-pages:
    needs: conformance
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    # Requires Settings → Pages → Source: "GitHub Actions". Until that is set, this job
    # fails without failing the workflow.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
